[project]
name = "boss-workbench-backend"
version = "1.0.1"
requires-python = ">=3.9"
dependencies = [
  "fastapi>=0.100",
  "uvicorn>=0.20",
  "pydantic>=2.0",
  "python-multipart>=0.0.5",
  "aiohttp>=3.8",
  "websocket-client>=1.5",
  "requests>=2.28",
  "pdfplumber>=0.7",
  "python-docx>=0.8",
  "reportlab>=4.0",
  "pillow>=9.0",
  "openai>=1.0",
  "cryptography>=42.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
